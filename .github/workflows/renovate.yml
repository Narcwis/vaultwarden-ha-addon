# =============================================================================
# Renovate — Automated Dependency Updates
# =============================================================================
# Runs Renovate on a schedule to check for new Vaultwarden releases.
# When a new version is detected (via Docker tag comparison), Renovate
# creates a PR updating vaultwarden/config.yaml with the latest version.
#
# The regex manager in renovate.json5 maps the `version` field in
# vaultwarden/config.yaml to vaultwarden/server Docker tags.
#
# Manual trigger via: Actions → Renovate → "Run workflow"
# =============================================================================

name: Renovate

on:
  schedule:
    # Daily at midnight UTC — Vaultwarden releases are infrequent
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      logLevel:
        description: "Renovate log level"
        required: false
        default: "info"
        type: choice
        options:
          - debug
          - info
          - warn
          - error

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: renovate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  renovate:
    name: Run Renovate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v41.0.0
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
