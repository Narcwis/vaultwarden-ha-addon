name: "Vaultwarden"
version: "1.8"
slug: "vaultwarden"
description: "Vaultwarden — lightweight Bitwarden-compatible password manager server"
url: "https://github.com/Narcwis/vaultwarden-ha-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
panel_icon: "mdi:form-textbox-password"
panel_title: "Vaultwarden"
homeassistant: "2023.8.0"
ports:
  80/tcp: 80
ports_description:
  80/tcp: "Vaultwarden web interface and API"
webui: "http://[HOST]:[PORT:80]"
options:
  signups_allowed: false
  admin_token: ""
  disable_admin_panel: false
schema:
  signups_allowed: bool
  domain: "str?"
  admin_token: "str?"
  disable_admin_panel: bool
