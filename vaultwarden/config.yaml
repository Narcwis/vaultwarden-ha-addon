name: "Vaultwarden"
version: "1.37.0"
slug: "vaultwarden"
description: "Vaultwarden — lightweight Bitwarden-compatible password manager server"
url: "https://github.com/Narcwis/vaultwarden-ha-addon"
arch:
  - aarch64
  - amd64
  - armhf
  - armv7
  - i386
panel_icon: "mdi:form-textbox-password"
panel_title: "Vaultwarden"
homeassistant: "2023.8.0"
ports:
  80/tcp: 80
  3012/tcp: 3012
ports_description:
  80/tcp: "Vaultwarden web interface and API"
  3012/tcp: "WebSocket notifications (optional, set notifications_port)"
map:
  - config:rw
  - ssl
options:
  signups_allowed: false
  port: 80
  notifications_port: 3012
schema:
  signups_allowed: bool
  domain: "str?"
  port: "int(80,65535)?"
  notifications_port: "int(0,65535)?"
  admin_token: "str?"
image: vaultwarden/server
